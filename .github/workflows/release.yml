name: Release PASADA

# Automatic versioning + release in one workflow.
#
#   git push origin main    # that's all — every push to main becomes a release
#
# The version lives in .github/version.txt (source of truth, currently 0.82.3).
# On each push to main the workflow bumps its PATCH number, writes the new
# version into tauri.conf.json + Cargo.toml + APP_VERSION (settings page),
# commits the bump with [skip ci] so it never re-triggers, tags v<version>,
# builds the signed installer, and publishes the GitHub Release the updater
# reads. Pushing a v* tag manually also works: it builds exactly that version
# without bumping.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify updater signing secrets (fail fast)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing or empty. Paste the FULL contents of the .key file from 'npx tauri signer generate' - it starts with 'untrusted comment: minisign encrypted secret key'. The .pub file does NOT work here."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing or empty."
            exit 1
          fi
          echo "Signing secrets present (values hidden)."

      - name: Determine version (bump patch on main, tag version on tag push)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            BASE=$(cat .github/version.txt)
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "mode=bump" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing PASADA v$VERSION"

      - name: Write version into tauri.conf.json, Cargo.toml, APP_VERSION
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p='frontend/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" frontend/src-tauri/Cargo.toml
          python - <<'PY'
          import os, re
          p = 'frontend/src/app/settings/page.tsx'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'const APP_VERSION = "[^"]*"', f'const APP_VERSION = "{os.environ["VERSION"]}"', s)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          echo "Stamped v$VERSION into all three files."

      - name: Commit version bump and tag (main pushes only)
        if: steps.version.outputs.mode == 'bump'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$VERSION" > .github/version.txt
          git add .github/version.txt
          git commit -m "chore: release v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python Backend (onedir)
        shell: bash
        run: |
          cd backend
          pip install -r requirements.txt
          # ONEDIR, not onefile: the onefile bundle self-extracted ~106 MB on
          # every launch — measured as the dominant chunk of cold boot. The
          # spec carries every hidden import + both docx templates, so no
          # long CLI lists.
          pyinstaller --clean --noconfirm --noupx pasada-backend.spec
          # The WHOLE folder becomes a Tauri bundle resource
          # (tauri.conf.json -> bundle.resources -> "backend/") and
          # src-tauri/src/lib.rs launches backend/pasada-backend(.exe)
          # from the resource dir (exe-dir fallback for local runs).
          mkdir -p ../frontend/src-tauri/backend
          cp -r dist/pasada-backend/. ../frontend/src-tauri/backend/

      - name: Build Tauri Frontend (signed)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd frontend
          npm install
          npm run tauri build

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          # Tauri v2 createUpdaterArtifacts:true produces NO .zip on Windows:
          # the updater re-uses the installer itself (x64-setup.exe / .msi)
          # plus a .sig sidecar. Copy installer + signature pairs.
          cp frontend/src-tauri/target/release/bundle/nsis/*.exe release-assets/ || true
          cp frontend/src-tauri/target/release/bundle/nsis/*.exe.sig release-assets/ || true
          cp frontend/src-tauri/target/release/bundle/msi/*.msi release-assets/ || true
          cp frontend/src-tauri/target/release/bundle/msi/*.msi.sig release-assets/ || true
          echo "--- release-assets:"; ls -la release-assets

      - name: Generate latest.json for the updater
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, glob

          version = os.environ["VERSION"]
          assets = {}
          # v2 updater artifacts: the installer itself + .sig sidecar
          for pattern in ("release-assets/*x64-setup.exe", "release-assets/*.msi"):
              for path in glob.glob(pattern):
                  name = os.path.basename(path)
                  if os.path.exists(path + ".sig"):
                      assets[name] = {
                          "signature": open(path + ".sig", "r").read().strip(),
                          "url": f"https://github.com/Meseten/PASADA/releases/download/v{version}/{name}",
                      }

          if not assets:
              raise SystemExit("No signed updater artifacts found: need x64-setup.exe + .sig or .msi + .sig. Check 'Prepare release assets' listing above.")

          # Prefer the NSIS setup installer for the updater manifest.
          setup = next((a for n, a in sorted(assets.items()) if n.endswith("x64-setup.exe")), None) \
                  or list(assets.values())[0]

          manifest = {
              "version": version,
              "notes": f"PASADA v{version}",
              "pub_date": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"windows-x86_64": setup},
          }
          with open("release-assets/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PASADA v${{ steps.version.outputs.version }}
          body: |
            PASADA v${{ steps.version.outputs.version }}

            New install: download and run the `...-setup.exe` installer below.

            Already have PASADA? No download needed: open PASADA, go to
            Settings > General, find the App Updates card, and click
            Check for Updates.
          # ONE glob only. Listing latest.json here AND relying on the
          # wildcard made the action upload it twice; the second upload
          # goes down the update-asset path and dies with
          # "Error: Not Found ... update-a-release-asset" (v0.82.3).
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
