name: Release PASADA

# Releasing a new version is a two-file, one-command process:
#   1. Bump "version" in frontend/src-tauri/tauri.conf.json
#      (and frontend/src-tauri/Cargo.toml + APP_VERSION in
#      frontend/src/app/settings/page.tsx to the same number)
#   2. Push a tag:  git tag v0.2.0 && git push origin v0.2.0
# The workflow builds the signed installer, signs the update bundle, and
# publishes a GitHub Release. Installed apps see the update through the
# updater and can install it from Settings > General (App Updates card),
# no zip needed.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY        contents of the .key file from
#                                    `npx tauri signer generate` (one time)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the passphrase for that key

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify updater signing secrets (fail fast)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing or empty. Paste the FULL contents of the .key file from 'npx tauri signer generate'."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing or empty."
            exit 1
          fi
          echo "Signing secrets present (values hidden)."

      - name: Read version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building PASADA v$VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python Backend
        shell: bash
        run: |
          cd backend
          pip install -r requirements.txt
          
          # NOTE: the package was renamed multipart -> python_multipart, and the
          # old "multipart" import name no longer exists in current versions.
          # Both names are listed so the build works on any pip version.
          pyinstaller --onefile --hidden-import passlib.handlers.bcrypt --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import python_multipart --hidden-import multipart --hidden-import anyio._backends._asyncio --hidden-import psutil --hidden-import jose --hidden-import pypdf --hidden-import win32com --hidden-import pythoncom --add-data "template.docx;." --add-data "dashboard_template.docx;." --name pasada-backend-x86_64-pc-windows-msvc main.py
          mkdir -p ../frontend/src-tauri/bin
          cp dist/pasada-backend-x86_64-pc-windows-msvc.exe ../frontend/src-tauri/bin/

      - name: Build Tauri Frontend (signed)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd frontend
          npm install
          npm run tauri build

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp frontend/src-tauri/target/release/bundle/nsis/*.exe release-assets/ || true
          cp frontend/src-tauri/target/release/bundle/msi/*.msi release-assets/ || true
          cp frontend/src-tauri/target/release/bundle/nsis/*.zip release-assets/ || true
          cp frontend/src-tauri/target/release/bundle/msi/*.zip release-assets/ || true
          ls -la release-assets

      - name: Generate latest.json for the updater
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, glob, hashlib, base64

          version = os.environ["VERSION"]
          assets = {}
          for path in glob.glob("release-assets/*.zip"):
              name = os.path.basename(path)
              with open(path, "rb") as f:
                  assets[name] = {
                      "signature": open(path + ".sig", "r").read().strip(),
                      "url": f"https://github.com/Meseten/PASADA/releases/download/v{version}/{name}",
                  }

          if not assets:
              raise SystemExit("No signed .zip updater artifacts found; check createUpdaterArtifacts output")

          platforms = sorted(
            ("windows-x86_64", a) for name, a in assets.items() if name.endswith("x64-setup.zip")
          ) or [("windows-x86_64", list(assets.values())[0])]

          manifest = {
              "version": version,
              "notes": f"PASADA v{version}",
              "pub_date": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {p: a for p, a in platforms},
          }
          with open("release-assets/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PASADA v${{ steps.version.outputs.version }}
          body: |
            PASADA v${{ steps.version.outputs.version }}

            New install: download and run the `...-setup.exe` installer below.

            Already have PASADA? No download needed: open PASADA, go to
            Settings > General, find the App Updates card, and click
            Check for Updates.
          files: |
            release-assets/latest.json
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
