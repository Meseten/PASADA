name: Build Windows PASADA

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python Backend
        shell: bash
        run: |
          cd backend
          pip install -r requirements.txt
          
          # NOTE: the package was renamed multipart -> python_multipart, and the
          # old "multipart" import name no longer exists in current versions.
          # Both names are listed so the build works on any pip version.
          pyinstaller --onefile --hidden-import passlib.handlers.bcrypt --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import python_multipart --hidden-import multipart --hidden-import anyio._backends._asyncio --hidden-import psutil --hidden-import jose --hidden-import pypdf --hidden-import win32com --hidden-import pythoncom --add-data "template.docx;." --add-data "dashboard_template.docx;." --name pasada-backend-x86_64-pc-windows-msvc main.py
          mkdir -p ../frontend/src-tauri/bin
          cp dist/pasada-backend-x86_64-pc-windows-msvc.exe ../frontend/src-tauri/bin/

      - name: Build Tauri Frontend
        shell: bash
        # tauri.conf.json enables createUpdaterArtifacts, so the Tauri CLI needs
        # the minisign PRIVATE key at build time to produce the .sig update
        # signatures. Without these env vars the build dies right after the
        # bundles are produced with "A public key has been found, but no private
        # key". The public key itself lives in tauri.conf.json (plugins.updater
        # .pubkey); these secrets must hold the .key file from
        # `npx tauri signer generate` and its passphrase.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd frontend
          npm install
          npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: PASADA-Windows-Installer
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
